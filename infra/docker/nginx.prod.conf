user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format covie_json escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"request_id":"$upstream_http_x_request_id"}';
  access_log /var/log/nginx/access.log covie_json;

  upstream covie_api { server api:8080; keepalive 32; }
  upstream covie_web { server web:3000; keepalive 32; }

  server {
    listen 80;
    server_name covie.vn www.covie.vn;
    return 301 https://covie.vn$request_uri;
  }

  server {
    listen 443 ssl;
    server_name covie.vn www.covie.vn;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    include /etc/nginx/security-headers.conf;

    location = /api/v1/me/events {
      proxy_pass http://covie_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 35m;
      proxy_send_timeout 35m;
      add_header X-Accel-Buffering no always;
      include /etc/nginx/security-headers.conf;
    }

    location = /api/v1/auth/ssr-refresh {
      proxy_read_timeout 60s;
      proxy_cache off;
      proxy_pass http://covie_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/v1/ {
      proxy_pass http://covie_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
    }

    location / {
      proxy_pass http://covie_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
