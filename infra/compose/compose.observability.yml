services:
  prometheus:
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks: [internal]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${COVIE_ALERT_WEBHOOK_FILE:?COVIE_ALERT_WEBHOOK_FILE is required}:/run/covie-secrets/alert-webhook-url:ro
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${COVIE_GRAFANA_ADMIN_PASSWORD:?COVIE_GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    networks: [internal]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile"]
    volumes:
      - /:/host:ro,rslave
      - ${COVIE_NODE_EXPORTER_TEXTFILE_DIR:?COVIE_NODE_EXPORTER_TEXTFILE_DIR is required}:/textfile:ro
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    name: covie_internal
volumes:
  prometheus-data: {}
  grafana-data: {}
