name: Plan 09 handoff append

on:
  push:
    branches:
      - feat/plan-09-web-completion

permissions:
  contents: write

jobs:
  append-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plan-09-web-completion
          fetch-depth: 0
      - name: Append Plan 09 handoff and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          PLAN="docs/CoVie-technical-plan-09-web-completion-v1.0.md"
          MARKER="## Implementation Handoff — 2026-08-24"
          if ! grep -Fq "$MARKER" "$PLAN"; then
            cat >> "$PLAN" <<'EOF'

---

