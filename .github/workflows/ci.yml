name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/plan-10-*'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GOOGLE_OAUTH_CLIENT_ID: ci-test-client
      GOOGLE_OAUTH_CLIENT_SECRET: ci-test-secret
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3000/api/v1/auth/google/callback/google
      JAVA_TOOL_OPTIONS: -Dcovie.test.minio-image=cgr.dev/chainguard/minio@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - name: Restore Maven wrapper executable bit
        run: chmod +x mvnw
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify backend with test OIDC fixtures and ephemeral RSA keys
        run: ./mvnw verify

  frontend-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore Maven wrapper executable bit
        run: chmod +x apps/api/mvnw
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Restore repository script executable bits
        run: chmod +x apps/api/mvnw infra/scripts/*.sh infra/deploy/*.sh infra/backup/*.sh infra/perf/*.sh
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Export OpenAPI
        run: ./infra/scripts/export-openapi.sh
      - name: Generate typed API client
        run: pnpm api-client:generate
      - name: Archive generated API contract for drift debugging
        uses: actions/upload-artifact@v7
        with:
          name: generated-api-contract
          path: |
            packages/api-client/openapi/openapi.json
            packages/api-client/src/generated/schema.ts
          retention-days: 1
      - name: Check generated contract drift
        run: git diff --exit-code -- packages/api-client/openapi/openapi.json packages/api-client/src/generated/schema.ts
      - name: Typecheck API client
        run: pnpm api-client:check
      - name: Typecheck web
        run: pnpm --filter @covie/web typecheck
      - name: Lint web
        run: pnpm --filter @covie/web lint
      - name: Test web
        run: pnpm --filter @covie/web test
      - name: Build web
        run: pnpm --filter @covie/web build
      - name: Validate social performance contracts and measurements
        run: node --test infra/perf/social-scenarios.test.mjs infra/perf/run-load.test.mjs
      - name: Test secret-hygiene status handling
        run: ./infra/scripts/test-secret-hygiene.sh
      - name: Reject tracked secrets
        run: ./infra/scripts/verify-secret-hygiene.sh

  release-security-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Restore repository script executable bits
        run: chmod +x infra/scripts/*.sh
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Trivy 0.72.0 source, misconfiguration and secret scan
        run: ./infra/scripts/security-scan.sh

  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan every fetched branch and tag for secrets
        run: |
          # Retain a blocking exit code; print only safe metadata for triage.
          # Never upload or echo Match, Secret, or raw scanner JSON.
          set +e
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/reports:rw" \
            zricethezav/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --log-opts=--all --gitleaks-ignore-path=/repo/.gitleaksignore \
            --redact --report-format=json --report-path=/reports/gitleaks-history.json
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ -f "$RUNNER_TEMP/gitleaks-history.json" ]; then
            python3 - "$RUNNER_TEMP/gitleaks-history.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              findings = json.load(f)
          for finding in findings:
              print("Potential historic secret (metadata only):", json.dumps({
                  "rule": finding.get("RuleID"),
                  "file": finding.get("File"),
                  "line": finding.get("StartLine"),
                  "commit": finding.get("Commit"),
              }, ensure_ascii=False))
          PY
          fi
          rm -f "$RUNNER_TEMP/gitleaks-history.json"
          exit "$result"
