spring:
  application:
    name: covie-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/covie}
    username: ${DB_USERNAME:covie}
    password: ${DB_PASSWORD:covie_local}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

covie:
  auth:
    issuer: ${COVIE_AUTH_ISSUER:https://covie.vn}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    action-ticket-ttl: PT10M
    jwt:
      key-id: ${COVIE_JWT_KEY_ID:covie-dev-1}
      private-key-path: ${COVIE_JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${COVIE_JWT_PUBLIC_KEY_PATH:}
    cookies:
      secure: ${COVIE_COOKIE_SECURE:true}
      same-site: Lax
      access-name: covie_at
      refresh-name: covie_rt
      action-name: covie_auth_action
