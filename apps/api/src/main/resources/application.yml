spring:
  application:
    name: covie-api
  security:
    oauth2:
      client:
        registration:
          google:
            provider: google
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:disabled-local-client}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:disabled-local-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:3000/api/v1/auth/google/callback/google}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/covie}
    username: ${DB_USERNAME:covie}
    password: ${DB_PASSWORD:covie_local}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

covie:
  checkout:
    session-ttl: 15m
  orders:
    confirmation-timeout: PT30M
    auto-complete-grace: PT24H
    pickup-no-show-grace: PT2H
    issue-close-timeout: P2D
  auth:
    issuer: ${COVIE_AUTH_ISSUER:https://covie.vn}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    action-ticket-ttl: PT10M
    jwt:
      key-id: ${COVIE_JWT_KEY_ID:covie-dev-1}
      private-key-path: ${COVIE_JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${COVIE_JWT_PUBLIC_KEY_PATH:}
    cookies:
      secure: ${COVIE_COOKIE_SECURE:true}
      same-site: Lax
      access-name: covie_at
      refresh-name: covie_rt
      action-name: covie_auth_action
  storage:
    bucket: ${COVIE_STORAGE_BUCKET:covie-media}
    region: ${COVIE_STORAGE_REGION:us-east-1}
    endpoint: ${COVIE_STORAGE_ENDPOINT:}
    public-base-url: ${COVIE_MEDIA_PUBLIC_BASE_URL:}
    force-path-style: ${COVIE_STORAGE_FORCE_PATH_STYLE:false}
    upload-url-ttl: 10m
    max-image-bytes: 10485760
    max-pending-uploads-per-user: 20
