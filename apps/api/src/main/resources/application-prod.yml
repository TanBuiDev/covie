spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
  data:
    redis:
      repositories:
        enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: logstash

springdoc:
  swagger-ui:
    enabled: false

covie:
  production:
    public-url: ${COVIE_PUBLIC_URL:https://covie.vn}
    e2e-support-enabled: ${COVIE_E2E_SUPPORT_ENABLED:false}
